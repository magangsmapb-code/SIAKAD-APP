name: SIAKAD CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-nextjs:
    name: Next.js Frontend (Lint, Typecheck, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies (Clean Install)
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Check
        run: npm run typecheck

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.siakad.smapemberdayaanbangsa.sch.id/api/v1

  api-nestjs:
    name: NestJS Backend (Unit & Integration Tests)
    runs-on: ubuntu-latest
    services:
      postgres-test:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password_secure_123
          POSTGRES_DB: siakad_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install API Dependencies
        working-directory: apps/api
        run: npm ci

      - name: Validate Prisma Schema
        working-directory: apps/api
        run: npx prisma validate

      - name: Generate Prisma Client
        working-directory: apps/api
        run: npx prisma generate

      - name: Run Database Migrations (Isolated Test Database)
        working-directory: apps/api
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test_user:test_password_secure_123@localhost:5432/siakad_test_db?schema=public
          DIRECT_URL: postgresql://test_user:test_password_secure_123@localhost:5432/siakad_test_db?schema=public

      - name: Run NestJS Unit Tests
        working-directory: apps/api
        run: npm test -- --coverage
        env:
          NODE_ENV: test
          PORT: 4001
          APP_TIMEZONE: Asia/Jakarta
          DATABASE_URL: postgresql://test_user:test_password_secure_123@localhost:5432/siakad_test_db?schema=public
          DIRECT_URL: postgresql://test_user:test_password_secure_123@localhost:5432/siakad_test_db?schema=public
          JWT_ACCESS_SECRET: ci_test_access_secret_do_not_use_in_prod_min_32_chars
          JWT_REFRESH_SECRET: ci_test_refresh_secret_do_not_use_in_prod_min_32_chars

      - name: Run NestJS E2E Security Tests
        working-directory: apps/api
        run: npm run test:e2e
        env:
          NODE_ENV: test
          PORT: 4001
          APP_TIMEZONE: Asia/Jakarta
          DATABASE_URL: postgresql://test_user:test_password_secure_123@localhost:5432/siakad_test_db?schema=public
          DIRECT_URL: postgresql://test_user:test_password_secure_123@localhost:5432/siakad_test_db?schema=public
          JWT_ACCESS_SECRET: ci_test_access_secret_do_not_use_in_prod_min_32_chars
          JWT_REFRESH_SECRET: ci_test_refresh_secret_do_not_use_in_prod_min_32_chars

      - name: Build NestJS Application
        working-directory: apps/api
        run: npm run build

  mobile-flutter:
    name: Flutter Mobile (Analyze & Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17 for Android Toolchain
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        working-directory: apps/mobile
        run: flutter doctor -v

      - name: Install Flutter Dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Run Flutter Static Analysis
        working-directory: apps/mobile
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter Unit & Widget Tests
        working-directory: apps/mobile
        run: flutter test --coverage

      - name: Build Flutter APK (Debug Artifact)
        working-directory: apps/mobile
        run: flutter build apk --debug --dart-define=DEMO_MODE=false
