# Upstream definitions matching Docker service names
upstream web_upstream {
    server web:3000;
    keepalive 32;
}

upstream api_upstream {
    server api:4000;
    keepalive 32;
}

# 1. HTTP Server - ACME Challenge & Enforce HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name siakad.smapemberdayaanbangsa.sch.id api-siakad.smapemberdayaanbangsa.sch.id localhost;

    # Let's Encrypt / Certbot challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all HTTP requests to HTTPS in production
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server - Web Frontend & Unified API Reverse Proxy
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name siakad.smapemberdayaanbangsa.sch.id api-siakad.smapemberdayaanbangsa.sch.id;

    # SSL Certificate configuration (Certbot volume mount)
    ssl_certificate /etc/letsencrypt/live/siakad/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/siakad/privkey.pem;

    # Modern TLS Security Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Max body size for file uploads
    client_max_body_size 10M;

    # Rate limiting connection limit per IP
    limit_conn conn_limit 20;

    # -------------------------------------------------------------------------
    # Backend NestJS API Routing (/api/v1/)
    # -------------------------------------------------------------------------
    location /api/v1/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://api_upstream;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Stricter rate limit on Auth Login endpoint to prevent brute force
    location /api/v1/auth/login {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://api_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------------
    # Frontend Next.js Web Application Routing (/)
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Static cache optimization
        location /_next/static/ {
            proxy_pass http://web_upstream;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
